<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" width="980" height="640" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b4a5e"/>
    </marker>
    <style>
      .q{fill:#ffffff;stroke:#22324a;stroke-width:1.5}
      .t{font-size:14.5px;font-weight:600;fill:#1f2933}
      .s{font-size:12px;fill:#5f6b7a}
      .l{stroke:#3b4a5e;stroke-width:1.6;fill:none;marker-end:url(#a)}
      .lab{font-size:12px;font-weight:600;fill:#3b4a5e}
      .clear{fill:#e3f3ea;stroke:#1e7b4a;stroke-width:1.5}
      .review{fill:#fdf3dc;stroke:#9a6700;stroke-width:1.5}
      .flag{fill:#fbe4e2;stroke:#b3261e;stroke-width:1.5}
      .rt{font-size:14px;font-weight:700}
    </style>
  </defs>
  <rect width="980" height="640" fill="#ffffff"/>
  <rect x="300" y="14" width="300" height="46" rx="23" fill="#22324a"/>
  <text x="450" y="43" text-anchor="middle" fill="#fff" font-size="15" font-weight="600">Alert arrives (POST /match/groq)</text>
  <path class="l" d="M450,60 L450,80"/>

  <rect class="q" x="250" y="82" width="400" height="58" rx="8"/>
  <text class="t" x="450" y="106" text-anchor="middle">1. Exact repeat of a whitelisted record?</text>
  <text class="s" x="450" y="126" text-anchor="middle">same client, same customer fields, same listing</text>
  <path class="l" d="M650,111 L760,111"/><text class="lab" x="670" y="104">yes</text>
  <rect class="clear" x="762" y="88" width="200" height="46" rx="8"/><text class="rt" x="862" y="116" text-anchor="middle" fill="#1e7b4a">CLEAR</text>
  <path class="l" d="M450,140 L450,160"/><text class="lab" x="458" y="155">no</text>

  <rect class="q" x="250" y="162" width="400" height="58" rx="8"/>
  <text class="t" x="450" y="186" text-anchor="middle">2. "Entity Details NOT AVAILABLE"?</text>
  <text class="s" x="450" y="206" text-anchor="middle">nothing to compare against</text>
  <path class="l" d="M650,191 L760,191"/><text class="lab" x="670" y="184">yes</text>
  <rect class="review" x="762" y="168" width="200" height="46" rx="8"/><text class="rt" x="862" y="196" text-anchor="middle" fill="#9a6700">REVIEW</text>
  <path class="l" d="M450,220 L450,240"/><text class="lab" x="458" y="235">no</text>

  <rect class="q" x="250" y="242" width="400" height="58" rx="8"/>
  <text class="t" x="450" y="266" text-anchor="middle">3. Match score below 0.80?</text>
  <text class="s" x="450" y="286" text-anchor="middle">customer vs listing: name, country, city, DOB, ID</text>
  <path class="l" d="M650,271 L760,271"/><text class="lab" x="670" y="264">yes</text>
  <rect class="clear" x="762" y="248" width="200" height="46" rx="8"/><text class="rt" x="862" y="276" text-anchor="middle" fill="#1e7b4a">CLEAR</text>
  <path class="l" d="M450,300 L450,320"/><text class="lab" x="458" y="315">no</text>

  <rect class="q" x="250" y="322" width="400" height="58" rx="8"/>
  <text class="t" x="450" y="346" text-anchor="middle">4. Similar whitelisted record of this client?</text>
  <text class="s" x="450" y="366" text-anchor="middle">listing similarity 80%+ after customer-field penalties</text>
  <path class="l" d="M650,351 L760,351"/><text class="lab" x="670" y="344">none</text>
  <rect class="review" x="762" y="328" width="200" height="46" rx="8"/><text class="rt" x="862" y="356" text-anchor="middle" fill="#9a6700">REVIEW</text>
  <path class="l" d="M450,380 L450,400"/><text class="lab" x="458" y="395">yes (top 5)</text>

  <rect class="q" x="200" y="402" width="500" height="78" rx="8"/>
  <text class="t" x="450" y="428" text-anchor="middle">5. AI review (Groq), one record at a time</text>
  <text class="s" x="450" y="448" text-anchor="middle">Does the analyst's reason (Analyst_Allow_Reasoning) still hold for this alert?</text>
  <text class="s" x="450" y="466" text-anchor="middle">Python then checks every fact the AI states against the data</text>

  <path class="l" d="M300,480 L170,540"/><path class="l" d="M450,480 L450,540"/><path class="l" d="M600,480 L730,540"/>
  <rect class="clear" x="60" y="542" width="230" height="66" rx="8"/>
  <text class="rt" x="175" y="568" text-anchor="middle" fill="#1e7b4a">CLEAR</text>
  <text class="s" x="175" y="590" text-anchor="middle">the earlier reason still applies</text>
  <rect class="review" x="335" y="542" width="230" height="66" rx="8"/>
  <text class="rt" x="450" y="568" text-anchor="middle" fill="#9a6700">REVIEW</text>
  <text class="s" x="450" y="590" text-anchor="middle">unsure, missing data, or cases disagree</text>
  <rect class="flag" x="610" y="542" width="240" height="66" rx="8"/>
  <text class="rt" x="730" y="568" text-anchor="middle" fill="#b3261e">FLAG</text>
  <text class="s" x="730" y="590" text-anchor="middle">the earlier reason no longer applies</text>
</svg>
